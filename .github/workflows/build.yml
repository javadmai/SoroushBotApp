name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Generate Android folder
        run: flutter create . --platforms android --project-name soroush_bot_app
      
      - name: Fix Android Manifest (HTTP, INTERNET & Name)
        run: |
          python3 - << 'EOF'
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              
              # ۱. افزودن مجوز اینترنت در صورت عدم وجود
              if 'android.permission.INTERNET' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
              
              # ۲. اجازه دادن به HTTP
              if 'usesCleartextTraffic' not in content:
                  content = content.replace('<application', '<application android:usesCleartextTraffic="true"')
              
              # ۳. تغییر نام برنامه
              content = content.replace('android:label="soroush_bot_app"', 'android:label="Javad Bot"')
              
              with open(manifest_path, 'w') as f:
                  f.write(content)
          EOF

      - name: Print Manifest for Debugging
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Javad-Bot-Release
          path: build/app/outputs/flutter-apk/app-release.apk